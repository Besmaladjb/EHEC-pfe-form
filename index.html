<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Career Preparation Survey</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--n:#0e2a47;--y:#ffc83d;--bg:#f4f7fb;--t:#e8f0fb;--g:#5b6b7f;--l:#dbe4ef}
*{box-sizing:border-box}
body{margin:0;font:16px/1.6 Cairo,"Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--n)}
button{font:inherit;cursor:pointer}
.hero{min-height:100vh;background:var(--n);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px}
.hero h1{font-size:clamp(30px,6vw,54px);line-height:1.15;margin:0 0 10px;font-weight:800;max-width:15em}
.hero p{color:#b9c8da;margin:2px 0;font-size:18px}.hero .meta{font-size:14px;margin-top:8px}
.langs{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;width:100%;max-width:660px;margin:34px 0 14px}
.lcard{background:#fff;color:var(--n);border:0;border-radius:14px;padding:24px 12px;transition:transform .15s,box-shadow .15s}
.lcard:hover,.lcard:focus-visible{transform:translateY(-4px);box-shadow:0 0 0 4px var(--y);outline:0}
.lcard b{display:block;font-size:26px}.lcard small{color:var(--g)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 110px}
.top{position:sticky;top:0;background:var(--bg);padding:14px 0 10px;z-index:5}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:15px}
.lg button{border:1px solid var(--l);background:#fff;padding:2px 10px;border-radius:6px;margin-inline-start:4px;font-size:13px;color:var(--n)}
.lg .on{background:var(--n);color:#fff;border-color:var(--n)}
.steps{display:flex;gap:8px;margin:12px 0 8px}.st{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--g)}
.st i{font-style:normal;width:26px;height:26px;border-radius:50%;background:var(--l);display:grid;place-items:center;font-weight:800;flex:none}
.st.on{color:var(--n);font-weight:600}.st.on i{background:var(--y)}.st.done i{background:var(--n);color:#fff}
.bar{height:5px;background:var(--l);border-radius:3px}.bar b{display:block;height:100%;background:var(--n);border-radius:3px;transition:width .4s}
h2{font-size:30px;margin:22px 0 0;font-weight:800}.sub{color:var(--g);margin:0 0 8px}
.q{background:#fff;border-radius:14px;padding:18px;margin:16px 0;border:2px solid transparent}
.q.bad{border-color:#d64545}.err{display:none;color:#d64545;margin:10px 0 0;font-size:14px}.bad .err{display:block}
.qt{display:flex;gap:12px;align-items:flex-start}.qt h3{margin:0;font-size:18px;line-height:1.45}
.num{background:var(--n);color:#fff;border-radius:8px;min-width:30px;height:30px;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.hint{color:var(--g);font-size:14px;margin:10px 0 0}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--l);border-radius:10px;cursor:pointer;position:relative;transition:background .15s}
.opt:hover{background:var(--bg)}.opt input,.sc input{position:absolute;opacity:0}
.opt::before{content:"";width:20px;height:20px;border:2px solid #9fb0c5;border-radius:50%;flex:none}
.opt:has(input[type=checkbox])::before{border-radius:5px}
.opt:has(input:checked){border-color:var(--n);background:var(--t)}
.opt:has(input:checked)::before{background:var(--n);border-color:var(--n);box-shadow:inset 0 0 0 3px #fff}
.opt:has(input:focus-visible),.sc label:has(input:focus-visible){outline:3px solid var(--y)}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}.sc label{position:relative}
.sc span{display:block;text-align:center;padding:14px 0;border:2px solid var(--l);border-radius:10px;font-weight:800;cursor:pointer}
.sc input:checked+span{background:var(--n);color:#fff;border-color:var(--n)}
.ends{display:flex;justify-content:space-between;gap:12px;color:var(--g);font-size:13px;margin-top:8px}
textarea{width:100%;min-height:120px;margin-top:14px;padding:12px;border:2px solid var(--l);border-radius:10px;font:inherit;resize:vertical}
textarea:focus{outline:0;border-color:var(--n)}
.oth{margin-top:10px}.oth[hidden]{display:none}
.oth input{width:100%;padding:12px;border:2px solid var(--l);border-radius:10px;font:inherit}
.oth input:focus{outline:0;border-color:var(--n)}
.nav{position:fixed;inset-inline:0;bottom:0;background:#fff;border-top:1px solid var(--l);padding:12px 16px;display:flex;justify-content:space-between;max-width:none;z-index:6}
.nav>*{min-width:120px}.nav button{padding:12px 26px;border-radius:10px;border:2px solid var(--n);background:var(--n);color:#fff;font-weight:600}
.nav .ghost{background:#fff;color:var(--n)}.nav button:disabled{opacity:.6}
.nav button:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.thx{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;background:var(--n);color:#fff}
.thx h1{margin:16px 0 4px;font-size:clamp(28px,5vw,42px)}.thx p{color:#b9c8da;max-width:30em}
.thx path{stroke:#fff;stroke-dasharray:40;stroke-dashoffset:40;animation:d .6s .3s forwards}
@keyframes d{to{stroke-dashoffset:0}}
@media(prefers-reduced-motion:reduce){.thx path{animation:none;stroke-dashoffset:0}*{transition:none!important}}
@media(max-width:520px){.st span{display:none}.st.on span{display:inline}}
</style></head><body><div id="app"></div>
<script src="questions.js"></script>
<script>
const URL_='https://script.google.com/macros/s/AKfycbweIxkg_d59OODma2_-xO26xOavJnYovupscEddmFNdf3U-CFRl4Lh5tmm0C0l9ASXX/exec';
const SEC=[[0,3],[3,7],[7,12]];
const S={
en:{sec:['About you','Career preparation','Your ideal app'],sub:['A few quick details.','How ready do you feel for the job market?','Tell us what would help you most.'],n:'Next',b:'Back',bad:'Please answer this question.',ty:'Your answers were recorded. They will directly shape the career app we are building for students like you.'},
fr:{sec:['À propos de vous','Préparation à la carrière','Votre application idéale'],sub:['Quelques informations rapides.','Dans quelle mesure vous sentez-vous prêt(e) pour le marché du travail ?','Dites-nous ce qui vous aiderait le plus.'],n:'Suivant',b:'Retour',bad:'Merci de répondre à cette question.',ty:'Vos réponses ont été enregistrées. Elles guideront directement l\'application que nous construisons pour les étudiants comme vous.'},
ar:{sec:['معلومات عنك','الاستعداد المهني','تطبيقك المثالي'],sub:['بعض المعلومات السريعة.','ما مدى استعدادك لسوق العمل؟','أخبرنا بما يساعدك أكثر.'],n:'التالي',b:'السابق',bad:'يُرجى الإجابة عن هذا السؤال.',ty:'تم تسجيل إجاباتك. ستساهم مباشرة في تصميم التطبيق الذي نبنيه لطلبة مثلك.'}};
let L='en',st=0;const A={},AO={},app=document.getElementById('app'),$=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function pick(){document.documentElement.dir='ltr';
app.innerHTML=`<div class="hero"><h1>Where are you heading after university?</h1><p lang="fr">Où allez-vous après l'université ?</p><p lang="ar" dir="rtl">إلى أين تتجه بعد الجامعة؟</p><div class="langs">`+
[['en','English','Start the survey'],['fr','Français','Commencer'],['ar','العربية','ابدأ الاستبيان']].map(l=>`<button class="lcard" onclick="setLang('${l[0]}')"><b>${l[1]}</b><small>${l[2]}</small></button>`).join('')+
`</div><p class="meta">5–7 min · Anonymous · Voluntary</p></div>`}
function setLang(l){L=l;document.documentElement.lang=l;document.documentElement.dir=l=='ar'?'rtl':'ltr';wiz()}
function wiz(){const u=UI[L],p=S[L],[s,e]=SEC[st];
let h=`<div class="wrap"><header class="top"><div class="row"><b class="brand">${u.t}</b><div class="lg">`+
['en','fr','ar'].map(l=>`<button class="${l==L?'on':''}" onclick="setLang('${l}')">${l.toUpperCase()}</button>`).join('')+
`</div></div><div class="steps">`+p.sec.map((x,k)=>`<div class="st ${k<st?'done':k==st?'on':''}"><i>${k<st?'✓':k+1}</i><span>${x}</span></div>`).join('')+
`</div><div class="bar"><b style="width:${(st+1)*100/3}%"></b></div></header><h2>${p.sec[st]}</h2><p class="sub">${p.sub[st]}</p>`;
for(let i=s+1;i<=e;i++){const q=Q[i-1],[t,o]=q[L],v=A[i]||[];
h+=`<section class="q" id="c${i}"><div class="qt"><span class="num">${i}</span><h3>${t}</h3></div>`;
if(q.k=='o')h+=`<textarea data-i="${i}">${esc(A[i]||'')}</textarea>`;
else if(q.k=='l')h+=`<div class="sc">`+[1,2,3,4,5].map(x=>`<label><input type="radio" name="q${i}" value="${x}" ${v[0]==x?'checked':''}><span>${x}</span></label>`).join('')+`</div><div class="ends"><span>1 · ${o[0]}</span><span>5 · ${o[1]}</span></div>`;
else{if(q.k=='m')h+=`<p class="hint">${q.max?u.m:u.ma}</p>`;
h+=`<div class="opts">`+o.map((x,j)=>`<label class="opt"><input type="${q.k=='m'?'checkbox':'radio'}" name="q${i}" value="${j+1}" ${v.includes(String(j+1))?'checked':''}><span>${x}</span></label>`).join('')+`</div>`;if(q.other)h+=`<div class="oth" id="o${i}" ${v.includes(String(q.other))?'':'hidden'}><input type="text" data-o="${i}" maxlength="200" placeholder="${u.o}" value="${esc(AO[i]||'')}"></div>`}
h+=`<p class="err">${p.bad}</p></section>`}
app.innerHTML=h+`<footer class="nav">${st?`<button class="ghost" onclick="go(-1)">${p.b}</button>`:'<span></span>'}<button id="nx" onclick="go(1)">${st==2?u.s:p.n}</button></footer></div>`}
app.addEventListener('change',e=>{const t=e.target;if(!t.name)return;const i=+t.name.slice(1);
if(t.type=='checkbox'){const c=[...app.querySelectorAll(`[name=${t.name}]:checked`)];if(Q[i-1].max&&c.length>Q[i-1].max){t.checked=false;return}A[i]=c.map(x=>x.value)}else A[i]=[t.value];
$('c'+i).classList.remove('bad');const f=$('o'+i);if(f)f.hidden=!A[i].includes(String(Q[i-1].other))});
app.addEventListener('input',e=>{const d=e.target.dataset;if(d.i)A[d.i]=e.target.value;else if(d.o)AO[d.o]=e.target.value});
function go(d){const [s,e]=SEC[st];
if(d>0){for(let i=s+1;i<=e;i++)if(i!=7&&!(A[i]&&A[i].length)){const c=$('c'+i);c.classList.add('bad');c.scrollIntoView({behavior:'smooth',block:'center'});return}
if(st<2){st++;wiz();scrollTo(0,0)}else send();return}
st--;wiz();scrollTo(0,0)}
async function send(){const b=$('nx');b.disabled=true;b.textContent='…';const r={},o={};
for(let i=1;i<=12;i++)r[i]=i==7?(A[7]||'').trim():A[i].join('|');
Q.forEach((q,k)=>{if(q.other&&A[k+1].includes(String(q.other)))o[k+1]=(AO[k+1]||'').trim()});
try{await fetch(URL_,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({lang:L,a:r,o})});
app.innerHTML=`<div class="thx"><svg viewBox="0 0 52 52" width="104" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none" stroke="#ffc83d" stroke-width="3"/><path d="M15 27l8 8 14-16" fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><h1>${UI[L].th}</h1><p>${S[L].ty}</p></div>`;scrollTo(0,0)}
catch(x){b.disabled=false;b.textContent=UI[L].s;alert('Network error. Please try again.')}}
pick();
</script></body></html>
