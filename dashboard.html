<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Survey dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--n:#0e2a47;--y:#ffc83d;--bg:#f4f7fb;--g:#5b6b7f;--l:#dbe4ef}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 Cairo,"Segoe UI",sans-serif;background:var(--bg);color:var(--n)}
header{background:var(--n);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}button,select,input{font:inherit}
header button{background:var(--y);color:var(--n);border:0;border-radius:8px;padding:6px 14px;font-weight:600;cursor:pointer;margin-inline-start:6px}
.flt{display:flex;gap:10px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:1px solid var(--l);align-items:center}
.flt label{font-size:12px;color:var(--g);display:flex;flex-direction:column}
select,input[type=search]{padding:6px 8px;border:1px solid var(--l);border-radius:8px;background:#fff;color:var(--n);max-width:230px}
nav{display:flex;gap:4px;padding:10px 20px 0}nav button{border:0;background:none;padding:8px 16px;border-radius:8px 8px 0 0;cursor:pointer;color:var(--g);font-weight:600}
nav .on{background:var(--n);color:#fff}
main{padding:16px 20px 40px;max-width:1200px;margin:0 auto}section{display:none}section.on{display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.k{background:#fff;border-radius:12px;padding:14px;border-inline-start:5px solid var(--y)}.k b{font-size:28px;display:block;line-height:1.1}.k span{color:var(--g);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px;margin-top:14px}
.c{background:#fff;border-radius:12px;padding:14px}.c h3{font-size:15px;margin:0 0 4px}.c small{color:var(--g)}.w{position:relative;margin-top:8px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--l);text-align:start}td small{color:var(--g)}
.sc{overflow-x:auto}.tx{border-bottom:1px solid var(--l);padding:8px 0}.tx i{font-style:normal;background:var(--l);border-radius:5px;padding:0 6px;font-size:12px;margin-inline-end:6px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>Career survey · results (all languages)</h1><div><span id="cnt"></span><button id="rf">Refresh</button><button id="dl">Download CSV</button></div></header>
<div class="flt" id="flt"></div>
<nav id="tabs"><button data-t="ov" class="on">Overview</button><button data-t="qs">All questions</button><button data-t="cx">Cross-analysis</button><button data-t="tx">Open answers</button></nav>
<main><section id="ov" class="on"></section><section id="qs"></section>
<section id="cx"><div class="flt" style="padding:0 0 12px;background:none;border:0"><label>Compare groups by<select id="sa"></select></label><label>Show distribution of<select id="sb"></select></label></div><div class="c"><div class="w" id="cxw" style="height:420px"><canvas id="cxc"></canvas></div></div><div class="c sc" style="margin-top:14px" id="cxt"></div></section>
<section id="tx"><div class="flt" style="padding:0 0 12px;background:none;border:0"><input type="search" id="q" placeholder="Search answers…"></div><div class="c" id="txl"></div></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="questions.js"></script>
<script>
const URL_='https://script.google.com/macros/s/AKfycbw0D-xekqVHNacFl88FtyyAPiUz9t3ebbXBzk1-Dr01lV5immoUGsnzDWdlvoUy7Nvx/exec';
const key=sessionStorage.k||prompt('Dashboard key');sessionStorage.k=key;
const $=id=>document.getElementById(id),PAL=['#0e2a47','#ffc83d','#2a9d8f','#e76f51','#6d597a','#4cc9f0','#8d99ae','#b5838d','#588157','#bc6c25','#355070','#e5989b'];
const LN={en:'English',fr:'French',ar:'Arabic'},ORD=[1,12];
let ALL=[],F={},CH=[],cxc,cur=[];
const lab=i=>Q[i-1].k=='l'?['1','2','3','4','5']:Q[i-1].en[1];
const cut=(s,n=42)=>s.length>n?s.slice(0,n-1)+'…':s;
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const rows=()=>ALL.filter(r=>(!F.lang||r[0]==F.lang)&&[1,2,3].every(i=>!F[i]||r[i]==F[i]));
function cnt(rs,i){const c=lab(i).map(()=>0);rs.forEach(r=>String(r[i]).split('|').forEach(x=>{if(c[x-1]!==undefined)c[x-1]++}));return c}
const n_=(rs,i)=>rs.filter(r=>r[i]).length;
const avg=(rs,i)=>{const v=rs.filter(r=>r[i]).map(r=>+r[i]);return v.length?v.reduce((a,b)=>a+b,0)/v.length:0};
const mk=(el,cfg)=>{const c=new Chart(el,cfg);CH.push(c);return c};
function card(par,t,h,sub){const d=document.createElement('div');d.className='c';d.innerHTML=`<h3>${esc(t)}</h3><small>${sub||''}</small><div class="w" style="height:${h}px"><canvas></canvas></div>`;par.appendChild(d);return d.querySelector('canvas')}
function bar(par,t,labels,data,o={}){const base=o.n||data.reduce((a,b)=>a+b,0)||1;let idx=labels.map((_,i)=>i);
if(o.sort)idx.sort((a,b)=>data[b]-data[a]);
const L=idx.map(i=>labels[i]),D=idx.map(i=>data[i]);
mk(card(par,t,o.h?60+L.length*30:280,`n = ${o.n||base}`),{type:'bar',data:{labels:L.map((l,i)=>o.h?cut(l,38)+' · '+Math.round(D[i]/base*100)+'%':cut(l,16)),datasets:[{data:D,backgroundColor:o.col||'#0e2a47',borderRadius:4}]},
options:{indexAxis:o.h?'y':'x',maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{title:x=>L[x[0].dataIndex],label:c=>`${c.raw} (${(c.raw/base*100).toFixed(0)}%)`}}},scales:{[o.h?'x':'y']:{beginAtZero:true,ticks:{precision:0}}}}})}
const topOf=(rs,i)=>{const c=cnt(rs,i),n=n_(rs,i)||1,m=c.indexOf(Math.max(...c));return [lab(i)[m],Math.round(c[m]/n*100)]};
function render(){CH.forEach(c=>c.destroy());CH=[];const rs=rows();cur=rs;$('cnt').textContent=`${rs.length} / ${ALL.length} responses`;
const ov=$('ov'),n=rs.length||1,a4=avg(rs,4),a5=avg(rs,5),pay=cnt(rs,12).slice(1,6).reduce((a,b)=>a+b,0);
ov.innerHTML=`<div class="kpis">`+[[rs.length,'responses'],[a4.toFixed(2)+' / 5','confidence in knowing employer skills'],[a5.toFixed(2)+' / 5','university prepares for real tasks'],[(a5-a4>=0?'+':'')+(a5-a4).toFixed(2),'preparedness minus confidence'],[Math.round(pay/n*100)+'%','would pay for premium'],[topOf(rs,6)[0].slice(0,38),'top obstacle ('+topOf(rs,6)[1]+'%)'],[topOf(rs,8)[0].slice(0,38),'top feature ('+topOf(rs,8)[1]+'%)']].map(k=>`<div class="k"><b style="${String(k[0]).length>12?'font-size:15px':''}">${esc(k[0])}</b><span>${k[1]}</span></div>`).join('')+`</div><div class="grid" id="og"></div>`;
const g=$('og'),lc=['en','fr','ar'].map(l=>rs.filter(r=>r[0]==l).length);
bar(g,'Responses by language',['English','Français','العربية'],lc);
const fl=lab(2),fa=fl.map((_,j)=>rs.filter(r=>r[2]==j+1));
mk(card(g,'Confidence vs. university preparedness, by field',300,'average score (1–5)'),{type:'bar',data:{labels:fl.map(f=>cut(f,18)),datasets:[{label:'Knows employer skills (Q4)',data:fa.map(x=>+avg(x,4).toFixed(2)),backgroundColor:'#0e2a47'},{label:'Studies prepare (Q5)',data:fa.map(x=>+avg(x,5).toFixed(2)),backgroundColor:'#ffc83d'}]},options:{maintainAspectRatio:false,scales:{y:{min:0,max:5}}}});
bar(g,Q[5].en[0],lab(6),cnt(rs,6),{h:1,sort:1,n:n_(rs,6)});
bar(g,Q[11].en[0],lab(12),cnt(rs,12),{h:1,n:n_(rs,12)});
bar(g,Q[7].en[0],lab(8),cnt(rs,8),{h:1,sort:1,n:n_(rs,8)});
bar(g,Q[10].en[0],lab(11),cnt(rs,11),{h:1,sort:1,n:n_(rs,11)});
const qs=$('qs');qs.innerHTML='<div class="grid" id="qg"></div>';
Q.forEach((q,k)=>{const i=k+1;if(q.k=='o')return;const c=cnt(rs,i);
bar($('qg'),`${i}. ${q.en[0]}`+(q.k=='l'?` (avg ${avg(rs,i).toFixed(2)})`:''),lab(i),c,{h:q.k!='l',sort:q.k!='l'&&!ORD.includes(i),n:n_(rs,i)})});
cx(rs);tx()}
function cx(rs=cur){if(cxc)cxc.destroy();const A=+$('sa').value,B=+$('sb').value,qa=Q[A-1],qb=Q[B-1],la=lab(A),lb=lab(B);
const grp=la.map((_,j)=>rs.filter(r=>String(r[A]).split('|').includes(String(j+1)))),gi=grp.map((g,j)=>j).filter(j=>grp[j].length);
const m=qb.k=='m',data=gi.map(j=>cnt(grp[j],B).map(v=>v/grp[j].length*100)),bi=lb.map((_,k)=>k).filter(k=>gi.some((j,x)=>data[x][k]>0));
cxc=new Chart($('cxc'),{type:'bar',data:{labels:gi.map(j=>cut(la[j],30)+` (n=${grp[j].length})`),datasets:bi.map((k,x)=>({label:cut(lb[k],40),data:gi.map((j,y)=>+data[y][k].toFixed(1)),backgroundColor:PAL[x%12]}))},
options:{indexAxis:'y',maintainAspectRatio:false,scales:{x:{stacked:!m,max:m?100:100,title:{display:true,text:'% of group'}},y:{stacked:!m}},plugins:{legend:{position:'bottom'}}}});
$('cxt').innerHTML=`<table><tr><th></th>${bi.map(k=>`<th>${esc(cut(lb[k],28))}</th>`).join('')}</tr>`+gi.map(j=>`<tr><th>${esc(cut(la[j],30))} <small>n=${grp[j].length}</small></th>`+bi.map(k=>{const c=cnt(grp[j],B)[k];return `<td>${c} <small>${Math.round(c/grp[j].length*100)}%</small></td>`}).join('')+'</tr>').join('')+'</table>'}
function tx(){const s=$('q').value.toLowerCase(),f=lab(2);$('txl').innerHTML=cur.filter(r=>r[7]&&r[7].toLowerCase().includes(s)).map(r=>`<div class="tx"><i>${r[0].toUpperCase()}</i><i>${esc(cut(f[r[2]-1]||'',24))}</i>${esc(r[7])}</div>`).join('')||'<small>No answers.</small>'}
function init(){const sel=(id,ph,p)=>`<label>${ph}<select data-f="${id}"><option value="">All</option>${p.map(x=>`<option value="${x[0]}">${esc(cut(x[1],40))}</option>`).join('')}</select></label>`;
$('flt').innerHTML=sel('lang','Language',Object.entries(LN))+[[1,'Level'],[2,'Field'],[3,'Situation']].map(x=>sel(x[0],x[1],lab(x[0]).map((o,j)=>[j+1,o]))).join('');
$('flt').onchange=e=>{F[e.target.dataset.f]=e.target.value;render()};
const opt=f=>Q.map((q,k)=>f(q)?`<option value="${k+1}">${k+1}. ${esc(cut(q.en[0],60))}</option>`:'').join('');
$('sa').innerHTML=opt(q=>q.k=='s'||q.k=='l');$('sb').innerHTML=opt(q=>q.k!='o');$('sa').value=2;$('sb').value=12;
$('sa').onchange=$('sb').onchange=()=>cx();$('q').oninput=tx;
$('tabs').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('nav button,main>section').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');$(t).classList.add('on')}}
function csv(){const h=['language',...Q.map((_,k)=>'Q'+(k+1))],q=s=>'"'+String(s).replace(/"/g,'""')+'"';
const body=rows().map(r=>[LN[r[0]],...Q.map((qq,k)=>{const i=k+1,v=r[i]||'';return qq.k=='o'?v:qq.k=='l'?v:String(v).split('|').map(x=>lab(i)[x-1]).join(' | ')})].map(q).join(','));
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+[h.map(q).join(','),...body].join('\n')],{type:'text/csv'}));a.download='survey_results.csv';a.click()}
function load(){fetch(URL_+'?key='+encodeURIComponent(key)).then(r=>r.json()).then(d=>{ALL=d;if(!$('sa').innerHTML)init();render()}).catch(()=>$('ov').textContent='Could not load data. Check the URL and key.')}
$('rf').onclick=load;$('dl').onclick=csv;load();
</script></body></html>
